# checkov 配置 — 云笺取舍（均有方案/架构出处，不接受无理由放宽）
framework:
  - terraform

# 交付门禁：无高危失败；下列项为已拍板取舍，逐条写明出处
skip-check:
  # —— S3（P-01）——
  # 单区域东京部署，无跨区容灾需求（方案 12 部署区域；成本模型未含 CRR）
  - CKV_AWS_144
  # 加密用 SSE-S3（AES256），不上 KMS：内部工具、免 KMS 管理面与费用（方案 12.8 成本口径）
  - CKV_AWS_145
  # S3 事件通知不在架构内：异步全部走 EventBridge Scheduler 与 Lambda 内部 job（架构 9 章）
  - CKV2_AWS_62
  # 访问日志桶不开 Versioning：日志为追加型，30 天过期即可（方案 12.7）；数据桶与状态桶均已开
  - CKV_AWS_21
  # —— CloudFront（P-03）——
  # 不做地理限制：100 人内部工具，无合规区域封锁需求（架构 8.4 / 方案 12）
  - CKV_AWS_374
  # 不做源站故障转移：单一 S3 源，无第二源可切（架构 8.4）
  - CKV_AWS_310
  # 不挂 WAF：方案 12.1 明确 HTTP API 侧亦无 WAF；成本模型未含 WAF（$5 预算装不下）
  - CKV_AWS_68
  - CKV2_AWS_47
  # 使用 *.cloudfront.net 默认证书：本期不配自定义域名/ACM（命名规范 13.1：不使用 Hosted UI）
  - CKV2_AWS_42
  # 已显式设 minimum_protocol_version=TLSv1.2_2021；checkov 对 default_certificate
  # 组合仍判失败（不认该写法），以 TF 配置为准
  - CKV_AWS_174
  # 响应头策略：安全头由 API 网关 CORS + 前端 meta 承担；架构未要求 CDN 注入安全头
  - CKV2_AWS_32
  # —— IAM（P-05）——
  # terraform 角色是管理面角色（方案 12.5 显式列举 cloudjian-*）；CloudFront/CE 等
  # 服务在资源创建前无稳定 ARN，CE 标签操作本身只支持 *。已收窄：角色 ARN 前缀、
  # 桶 ARN 显式列举、APIGW 区域限定、SSM 前缀、日志组前缀、scheduler 组前缀。
  # 凭证暴露/权限管理类检查针对的是「给用户放 admin」模式，此处为 CI 服务角色。
  - CKV_AWS_287
  - CKV_AWS_289
  - CKV_AWS_290
  - CKV_AWS_355
  # 架构 10.7：日志保留 30 天（非 1 年）——审计 JSON 同组，S3 侧另有 30 天访问日志
  - CKV_AWS_338

  # —— API Gateway（P-06）——
  # N8（GET /public/notes/{public_token}）刻意 authorization_type=NONE（红线2 公开匿名读）；
  # 其余路由显式 JWT（verify_routes_structure 断言 ≥30 条），结构门禁兜底
  - CKV_AWS_309
  # 访问日志组不做 KMS：与 S3 同口径（方案 12.8 成本模型未含 KMS；CKV_AWS_145 已同因跳过）
  - CKV_AWS_158

  # —— SSM（P-07）——
  # 架构 10.2：参数总线不存业务数据/机密（桶名、域名、ID、ARN）；用 Standard 免费类型，
  # 不上 SecureString（免 KMS 管理面与费用，与 SSE-S3 同成本口径，方案 12.2/12.8）
  - CKV2_AWS_34
