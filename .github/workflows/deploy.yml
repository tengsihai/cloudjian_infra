# 部署流水线
# push 到 release：二次校验「必须是已合并 PR 的 commit」→ apply → 结构与线上校验
# 变更触及桶策略/分发时自动做匿名穿透验证。
# 禁 pull_request_target；带凭证 job 一律 environment: release。
name: deploy

on:
  push:
    branches: [release]

permissions:
  contents: read
  pull-requests: read # gh pr list --search <sha>

concurrency:
  group: deploy-release
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ap-northeast-1

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 防 admin 旁路直推：查不到已合并 PR 即失败、不部署
      - name: Verify commit came from a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${GITHUB_SHA}"
          echo "Searching merged PR for ${SHA}…"
          MATCH=$(gh pr list --repo "${GITHUB_REPOSITORY}" --state merged --search "${SHA}" --json number,mergeCommit --jq ".[] | select(.mergeCommit.oid==\"${SHA}\") | .number" || true)
          # 某些合并方式 mergeCommit 与 SHA 不一致：再按 head sha 宽匹配
          if [ -z "${MATCH}" ]; then
            MATCH=$(gh pr list --repo "${GITHUB_REPOSITORY}" --state merged --search "${SHA}" --json number --jq ".[].number" || true)
          fi
          if [ -z "${MATCH}" ]; then
            echo "::error::commit ${SHA} 未关联任何已合并 PR（禁止直推部署）"
            exit 1
          fi
          echo "OK: linked PR #${MATCH}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: terraform init + workspace
        run: |
          terraform init -input=false
          terraform workspace select tokyo || terraform workspace new tokyo

      - name: terraform apply
        run: terraform apply -input=false -auto-approve

      - name: Post-apply structure gates
        run: |
          bash scripts/verify_static.sh
          bash scripts/verify_apigw_shell.sh
          bash scripts/verify_ssm_structure.sh
          bash scripts/verify_observability_structure.sh

      # apply 后可跑的 live 校验（SSM / 路由）；路由由 backend 注册，未注册时 routes 校验可失败
      - name: Live gates (SSM + routes)
        run: |
          bash scripts/verify_ssm_live.sh
          bash scripts/verify_routes_live.sh || true

      # 变更涉及桶策略/分发行为 → 匿名穿透验证
      - name: Detect policy/CDN changes
        id: changed
        run: |
          BASE=$(git rev-parse HEAD^ || git rev-parse HEAD)
          if git diff --name-only "${BASE}" HEAD | grep -qE '(^policy\.tf$|^modules/cdn/|^modules/storage/)'; then
            echo "penetrate=true" >> "$GITHUB_OUTPUT"
          else
            echo "penetrate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Anonymous CDN penetration
        if: steps.changed.outputs.penetrate == 'true'
        run: bash scripts/verify_cdn_matrix.sh
