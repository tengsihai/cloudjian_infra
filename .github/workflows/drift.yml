# INF-10 · 每周漂移检查（方案 12.4 步骤5 / 任务拆解 9.4）
# 非每日（省 CI 分钟）；有差异开 Issue。
name: drift

on:
  schedule:
    # 每周一 03:00 UTC（东京 12:00）
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: drift
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ap-northeast-1

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: terraform init + workspace
        run: |
          terraform init -input=false
          terraform workspace select tokyo

      - name: terraform plan (drift)
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=drift.tfplan
          code=$?
          set -e
          # 0=无差异 1=错误 2=有差异
          echo "exit=$code"
          if [ "$code" -eq 2 ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            terraform show -json drift.tfplan > drift.json
            python scripts/plan_summary.py drift.json > summary.md || true
          elif [ "$code" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::terraform plan failed"
            exit 1
          fi

      - name: Open Issue on drift
        if: steps.plan.outputs.drift == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let body = 'Terraform 周检发现配置与线上漂移。\n\n';
            try {
              body += fs.readFileSync('summary.md', 'utf8');
            } catch (e) {
              body += '_summary unavailable_\n';
            }
            body += `\n\n- run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift',
            });
            const existing = issues.find(i => i.title.includes('Terraform drift'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Terraform drift — ${new Date().toISOString().slice(0, 10)}`,
                body,
                labels: ['drift'],
              });
            }
